[project]
name = "15min-life-circle-backend"
version = "0.1.0"
description = "「15 分钟生活圈」智能体检与规划助手 —— 后端（FastAPI + 百度地图 Web 服务）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "contourpy>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/ai/tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
