[pytest]
; S4 · AI 层：让 pytest 根目录固定为 backend/，从而可以 `import app.ai`
pythonpath = .
; ⚠️ 顺序敏感：必须 app/ai/tests 在前、tests 在后。
;    实测 backend/conftest.py（根 conftest，注入 mock provider）若先于
;    app/ai/tests/conftest.py 加载，会让 AI 层测试的 stub 客户端注入失败，
;    退化成真实 HTTP 调用（401）→ 13 个用例失败。
;    不要按字母序重排，也不要改成 "pytest tests app/ai/tests"。
testpaths = app/ai/tests tests
addopts = -q
filterwarnings =
    error::SyntaxWarning
