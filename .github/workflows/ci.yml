# ==============================================================================
# CI —— 「15 分钟生活圈」智能体检与规划助手
#
# 目标（对应赛题「开源工程规范 15%」）：
#   1) secret-scan : 密钥泄漏扫描（.env / AK / SK / LLM Key 一律不得入库）
#   2) backend     : Python 测试（零依赖自测 + pytest）+ 等时圈基准复跑
#   3) frontend    : 前端构建（pnpm/npm 自适应；无 package.json 时优雅跳过并告警）
#   4) docker      : Dockerfile / compose 校验，并在可用时真实构建镜像
#
# 说明：前端与 API 入口由并行子任务产出，中间态可能缺文件。
#       因此各步骤均做存在性判断：缺失的产物打印警告并跳过，而不是让 CI 假绿或误红。
# ==============================================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. 密钥泄漏扫描（最优先，失败即整体失败）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查 .env 未被跟踪，且只有 .env.example
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交进仓库了！请 git rm --cached .env 并轮换密钥。"
            exit 1
          fi
          test -f .env.example || { echo "::error::缺少 .env.example"; exit 1; }
          echo "OK: .env 未被跟踪，.env.example 存在"

      - name: 扫描高置信度硬编码密钥（LLM Key 前缀 / 赋值形态）
        shell: bash
        run: |
          set -uo pipefail
          # 说明：这里只匹配【高置信度】的赋值形态，避免把 32 位哈希、构建产物名、
          #       示例占位符误判为密钥（误报会让 CI 变成狼来了）。
          #       百度 AK/SK 的更多形态交给下一步的 gitleaks 全历史扫描。
          files="$(git ls-files '*.py' '*.ts' '*.js' '*.vue' '*.json' '*.yml' '*.yaml' '*.ps1' '*.sh' | grep -v '^docs/' | grep -v 'check_ak.py' || true)"
          hits=""
          if [ -n "$files" ]; then
            # ① LLM Key：真实形态为 sk- 前缀 + 32 位十六进制
            hits="$(echo "$files" | xargs -r grep -nIE 'sk-[0-9a-fA-F]{32}' 2>/dev/null || true)"
            # ② 变量赋值形态：KEY = "长串"（右侧 ≥20 位字母数字）
            hits="$hits$(echo "$files" | xargs -r grep -nIE '(baidu_map_[a-z_]*|server_ak|server_sk|api_key|apikey|access_key)[a-z_]*[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]{20,}' 2>/dev/null || true)"
          fi
          if [ -n "$(echo "$hits" | tr -d '[:space:]')" ]; then
            echo "::error::疑似硬编码密钥，请改用 .env 注入。命中如下："
            echo "$hits"
            exit 1
          fi
          echo "OK: 未检出高置信度硬编码密钥"

      - name: gitleaks 全历史扫描（配置见 .gitleaks.toml）
        shell: bash
        run: |
          set -euo pipefail
          # 不用 gitleaks/gitleaks-action@v2：它在【首次推送】时会按 push 事件算出
          #   6bb0732a^..e7030e8
          # 这样的扫描区间，而首个提交是根提交、没有父节点，
          # 于是 git 直接报 "ambiguous argument ... unknown revision" 使 CI 失败
          # （实测 2026-10-16 首次推送即复现）。
          # 改为直接下载并扫描全部历史：行为确定，不依赖区间推断。
          VER=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact -v --exit-code=2 --config .gitleaks.toml

  # ---------------------------------------------------------------------------
  # 2. 后端：测试 + 基准
  # ---------------------------------------------------------------------------
  backend:
    name: 后端测试与基准（Python 3.13）
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          # 用 requirements-dev.txt（= 运行时依赖 + pytest/respx 等测试依赖）。
          # 只装 requirements.txt 时，故障注入测试会因缺 respx 直接报
          # ModuleNotFoundError 而失败（实测 CI 上 4 个用例）。
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest
          fi

      - name: 依赖自检（打印关键库是否可导入）
        working-directory: backend
        run: |
          python -c "import fastapi, numpy, scipy, shapely, contourpy; print('deps ok')"

      - name: 零依赖自测（scripts/selftest.py）
        working-directory: backend
        run: |
          if [ -f scripts/selftest.py ]; then
            python scripts/selftest.py
          else
            echo "::warning::backend/scripts/selftest.py 不存在，跳过"
          fi

      - name: pytest
        working-directory: backend
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            python -m pytest -q
          else
            echo "::warning::backend/tests/test_*.py 不存在，跳过 pytest"
          fi

      - name: 等时圈基准（合成场景，复现 bench/result.txt）
        working-directory: backend
        run: |
          if [ -f bench/benchmark_isochrone.py ]; then
            python bench/benchmark_isochrone.py
            echo "-------- bench/result.txt --------"
            cat bench/result.txt
          else
            echo "::warning::backend/bench/benchmark_isochrone.py 不存在，跳过基准"
          fi

      - name: 上传基准结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: backend/bench/result.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. 前端构建
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检测前端工程是否存在
        id: probe
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            if [ -f frontend/pnpm-lock.yaml ]; then
              echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            elif [ -f frontend/yarn.lock ]; then
              echo "pm=yarn" >> "$GITHUB_OUTPUT"
            else
              echo "pm=npm" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/package.json 不存在（前端由并行子任务产出），跳过前端构建"
          fi

      - name: 安装前端依赖
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: |
          case "${{ steps.probe.outputs.pm }}" in
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            *)    npm ci || npm install ;;
          esac

      - name: 类型检查（存在则跑）
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['type-check']?0:1)"; then
            npm run type-check
          else
            echo "::notice::未定义 type-check 脚本，跳过"
          fi

      - name: 构建
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: 上传前端产物
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Docker：文件校验 + 构建
  # ---------------------------------------------------------------------------
  docker:
    name: Docker 校验与构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Dockerfile 与 compose 文件结构
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "::error::缺少 Dockerfile"; exit 1; }
          test -f docker-compose.yml || { echo "::error::缺少 docker-compose.yml"; exit 1; }
          test -f .dockerignore || { echo "::error::缺少 .dockerignore"; exit 1; }
          grep -q '^FROM ' Dockerfile || { echo "::error::Dockerfile 缺少 FROM 指令"; exit 1; }
          grep -q '^# syntax=docker/dockerfile' Dockerfile || echo "::warning::Dockerfile 未声明 syntax 指令"
          if ! grep -q 'frontend' Dockerfile || ! grep -q 'backend' Dockerfile; then
            echo "::error::Dockerfile 应同时包含 frontend 与 backend 阶段"
            exit 1
          fi
          echo "OK: Dockerfile / docker-compose.yml / .dockerignore 结构校验通过"

      - name: compose 语法校验
        run: docker compose -f docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送；PR 上允许失败，因为前端产物可能尚未落地）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: 15min-life-circle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: ${{ github.event_name != 'push' }}

      - name: 冒烟：容器内 /api/health
        shell: bash
        run: |
          set -uo pipefail
          if ! docker run -d --name lc-ci -p 8000:8000 -e DATA_MODE=replay 15min-life-circle:ci; then
            echo "::warning::镜像不存在或启动失败（前端产物可能尚未落地），跳过冒烟"
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json 2>/dev/null; then
              echo "OK: $(cat /tmp/health.json)"
              docker rm -f lc-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::warning::容器启动后 /api/health 未在 60 秒内就绪（API 层可能尚未产出），打印日志"
          docker logs lc-ci || true
          docker rm -f lc-ci >/dev/null || true
