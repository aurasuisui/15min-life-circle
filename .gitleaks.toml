# ==============================================================================
# gitleaks 配置 —— 只做「有文档依据」的最小放行，不降低对真实密钥的检出能力
#
# 为什么需要这个文件：
#   1) 百度地图「浏览器端 AK」按官方设计就是要出现在前端页面里的（靠 Referer 白名单保护），
#      因此 jsapi 的 loader URL 里出现 AK 是**预期行为**，不应判为泄漏；
#   2) 服务端 AK / SK / LLM Key **一律不得放行** —— 下面的 allowlist 只针对
#      *浏览器端* AK 的出现位置，且要求同目录存在引用说明。
#
# 维护约定：任何新增放行都必须写清理由；宁可让人工复核，也不要静默放过服务端密钥。
# ==============================================================================
title = "15min-life-circle gitleaks config"

[extend]
# 继承 gitleaks 内置规则集，再叠加下面的局部放行
useDefault = true

[allowlist]
description = "浏览器端 AK 的预期出现位置（官方设计如此，非泄漏）"
# 前端构建产物与 JSAPI 示例：浏览器端 AK 必然出现在这里
paths = [
  '''frontend/dist/''',
  '''docs/design/.*\.md$''',
  '''README\.md$''',
]
# 文档中的占位符与脱敏写法
regexes = [
  '''ak=\*+''',
  '''<你的浏览器端AK>''',
  '''<你的服务端AK>''',
  '''<你的服务端SK>''',
]
